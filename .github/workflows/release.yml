name: Release

# Pushing a vX.Y.Z tag publishes a GitHub Release with the archives,
# checksums.txt, install.sh and build provenance attestations. `task release
# VERSION=X.Y.Z` creates and pushes the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: with no secret set the key is empty and telemetry never sends.
          SMELT_TELEMETRY_WRITE_KEY: ${{ secrets.SMELT_TELEMETRY_WRITE_KEY }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Publishes the agent kit (kit/) as ghcr.io/smeltdev/smelt-kit:<KitVersion> and
  # :<KitVersion>-<smelt version> for amd64 and arm64, signed by digest.
  kit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      KIT_REPO: ghcr.io/smeltdev/smelt-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build, push and sign the kit
        shell: bash
        run: kit/publish.sh "${GITHUB_REF_NAME#v}" | tee -a "$GITHUB_STEP_SUMMARY"
      # GitHub exposes visibility changes only in package settings, not its
      # supported Packages REST API. Never assume packages:write makes it public.
      - name: Verify the kit is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          visibility=$(gh api orgs/smeltdev/packages/container/smelt-kit --jq .visibility) || {
            echo '::error::Cannot read kit visibility. Grant this repository Actions access to the package and retry.'
            exit 1
          }
          if [ "$visibility" != public ]; then
            echo '::error::A package admin must open https://github.com/orgs/smeltdev/packages/container/smelt-kit/settings and change visibility to Public, then rerun this job. GitHub has no supported API to automate this first-publish step.'
            exit 1
          fi
